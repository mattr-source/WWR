<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">WWR prototype unit: Scout (top-down, facing up). Original placeholder art.</title>
  <g stroke="#1b1f1a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="66" rx="44" ry="46" fill="#000" fill-opacity=".14" stroke="none"/>
    <!-- four articulated wheeled legs -->
    <path d="M50 50 L28 34 M78 50 L100 34 M50 88 L28 100 M78 88 L100 100" fill="none" stroke-width="6"/>
    <path d="M50 50 L28 34 M78 50 L100 34 M50 88 L28 100 M78 88 L100 100" fill="none" stroke="#8a939b" stroke-width="2"/>
    <rect x="20" y="24" width="14" height="20" rx="5" fill="#5b636b"/>
    <rect x="94" y="24" width="14" height="20" rx="5" fill="#5b636b"/>
    <rect x="20" y="90" width="14" height="20" rx="5" fill="#5b636b"/>
    <rect x="94" y="90" width="14" height="20" rx="5" fill="#5b636b"/>
    <!-- twin light guns -->
    <rect x="53" y="10" width="6" height="22" rx="2" fill="#5b636b"/>
    <rect x="69" y="10" width="6" height="22" rx="2" fill="#5b636b"/>
    <!-- narrow arrow hull -->
    <path d="M64 16 L86 50 L80 104 L48 104 L42 50 Z" fill="#6b7a3a"/>
    <path d="M64 24 L80 50 L64 44 L48 50 Z" fill="#4c5729" stroke="none"/>
    <!-- accent chevron -->
    <path d="M46 58 L64 50 L82 58" fill="none" stroke="#f28c28" stroke-width="5"/>
    <!-- sensor dish + antenna -->
    <circle cx="64" cy="74" r="11" fill="#8a939b"/>
    <circle cx="64" cy="74" r="4" fill="#3fc1c9"/>
    <path d="M74 88 L92 118" fill="none" stroke-width="2.5"/>
    <circle cx="92" cy="118" r="3" fill="#f28c28" stroke-width="2"/>
    <!-- blank company plate -->
    <rect x="56" y="92" width="16" height="7" rx="1.5" fill="#d9d4c3" stroke-width="2"/>
  </g>
</svg>
