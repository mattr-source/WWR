    <circle cx="64" cy="64" r="14" fill="#5b636b"/>
    <circle cx="64" cy="64" r="10" fill="none" stroke="#3fc1c9" stroke-width="5"/>
    <!-- blank company plate -->
    <rect x="56" y="81" width="16" height="7" rx="1.5" fill="#d9d4c3" stroke-width="2"/>
    <!-- docked maintenance drone (rear) -->
    <path d="M54 104 L74 116 M74 104 L54 116" fill="none" stroke-width="2.5"/>
    <circle cx="54" cy="104" r="3.5" fill="#8a939b" stroke-width="2"/>
    <circle cx="74" cy="104" r="3.5" fill="#8a939b" stroke-width="2"/>
    <circle cx="54" cy="116" r="3.5" fill="#8a939b" stroke-width="2"/>
    <circle cx="74" cy="116" r="3.5" fill="#8a939b" stroke-width="2"/>
    <circle cx="64" cy="110" r="5" fill="#3fc1c9" stroke-width="2"/>
